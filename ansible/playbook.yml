---
- name: Configure SonicNode Server
  hosts: sonicnode
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Add Docker official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable
        state: present

    - name: Install Docker and Docker Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker is running and starts on boot
      systemd:
        name: docker
        state: started
        enabled: yes

    # ... (keep all your existing docker installation tasks above this) ...

    - name: Clean up old project directory
      file:
        path: /home/ubuntu/sonicnode
        state: absent

    - name: Clone project directly from GitHub
      git:
        repo: https://github.com/elhananmajaw10/SonicNode.git
        dest: /home/ubuntu/sonicnode
        version: main
        force: yes

    - name: Start the SonicNode application
      command: docker compose up -d --build
      args:
        chdir: /home/ubuntu/sonicnode