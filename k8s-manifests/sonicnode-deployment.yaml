---
# 💻 FRONTEND DEPLOYMENT & SERVICE (LoadBalancer)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: elhananmajaw10/sonicnode-frontend:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer # Exposes the frontend to the internet
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000