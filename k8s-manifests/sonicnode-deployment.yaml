---
# 🗄️ MONGODB DEPLOYMENT & SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

---
# 🎵 MUSIC SERVICE DEPLOYMENT & SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-service-deployment
spec:
  replicas: 2 # Clustering enabled for high availability!
  selector:
    matchLabels:
      app: music-service
  template:
    metadata:
      labels:
        app: music-service
    spec:
      containers:
      - name: music-service
        image: elhananmajaw10/sonicnode-music-service:latest
        ports:
        - containerPort: 3001
        livenessProbe: # Health checks enabled!
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: music-service
spec:
  selector:
    app: music-service
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001

